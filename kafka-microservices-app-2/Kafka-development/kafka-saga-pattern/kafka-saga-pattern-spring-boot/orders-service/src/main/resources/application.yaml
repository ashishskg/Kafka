server:
  port: 8081

spring:
  application:
    name: orders-service
  jackson:
    deserialization:
      fail-on-unknown-properties: true

  kafka:
    bootstrap-servers: "localhost:9091,localhost:9092,localhost:9093"

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      properties:
        delivery.timeout.ms: 120000
        linger.ms: 0
        request.timeout.ms: 30000
        max.in.flight.requests.per.connection: 5
        enable.idempotence: true

    consumer:
      group-id: orders-ms
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: com.org.common.*

orders:
  commands:
    topic:
      name: orders-commands-topic
  events:
    topic:
      name: orders-events-topic

products:
  commands:
    topic:
      name: products-commands-topic
  events:
    topic:
        name: products-events-topic

payments:
  commands:
    topic:
      name: payments-commands-topic
  events:
    topic:
      name: payments-events-topic
---
spring:
  datasource:
    username: ashish
    password: ashish
    url: jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true