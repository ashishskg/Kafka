#debug: true

server:
  port: 8082

spring:
  application:
    name: email-notification-service

  kafka:
    bootstrap-servers: localhost:9092,localhost:9094
    consumer:
      group-id: product-created-events

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: ashish
    password: ashish

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: mappings